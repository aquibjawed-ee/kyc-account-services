services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-kyc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kyc_local}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kyc}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "29092:29092"   # host access for kafka CLI tools; containers use kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  account-creation-service:
    build:
      context: .
      args:
        MODULE: account-creation-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kyc_creation
      DB_USERNAME: ${DB_USERNAME:-kyc}
      DB_PASSWORD: ${DB_PASSWORD:-kyc_local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: compose
      KYC_SLA_WINDOW: ${KYC_SLA_WINDOW:-PT24H}   # compress for manual runs, e.g. PT30S
      KYC_SLA_SWEEP_INTERVAL: ${KYC_SLA_SWEEP_INTERVAL:-PT1M}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  account-verification-service:
    build:
      context: .
      args:
        MODULE: account-verification-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kyc_verification
      DB_USERNAME: ${DB_USERNAME:-kyc}
      DB_PASSWORD: ${DB_PASSWORD:-kyc_local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: compose   # enables the in-process fake identity provider
      KYC_REVIEW_DELAY_MIN: ${KYC_REVIEW_DELAY_MIN:-PT1H}   # compress for manual runs, e.g. PT5S
      KYC_REVIEW_DELAY_MAX: ${KYC_REVIEW_DELAY_MAX:-PT2H}   # e.g. PT10S
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  pgdata:
