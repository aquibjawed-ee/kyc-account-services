# Build + test all modules with the same command the harness build gate uses. Integration tests run PostgreSQL 16
# (Zonky embedded binaries) and Kafka (spring-kafka-test, KRaft) in-JVM, so no Docker or service containers are needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surefire-reports
          path: '*/target/surefire-reports/'
          if-no-files-found: ignore
