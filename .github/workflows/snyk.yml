# Snyk security scans. Requires repository secret SNYK_TOKEN.
# Optional repository variables: SNYK_ORG (org slug/ID), SNYK_SEVERITY_THRESHOLD (default: high),
# SNYK_CLI_VERSION (default: latest; pin e.g. v1.1293.1 for reproducible builds).
name: Snyk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  SNYK_ORG: ${{ vars.SNYK_ORG }}
  SNYK_SEVERITY_THRESHOLD: ${{ vars.SNYK_SEVERITY_THRESHOLD || 'high' }}
  SNYK_CLI_VERSION: ${{ vars.SNYK_CLI_VERSION || 'latest' }}

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Snyk CLI
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl -sSfL "https://downloads.snyk.io/cli/${SNYK_CLI_VERSION}/snyk-linux" -o /usr/local/bin/snyk
          chmod +x /usr/local/bin/snyk
          snyk --version
          echo "SNYK_ORG_ARG=${SNYK_ORG:+--org=$SNYK_ORG}" >> "$GITHUB_ENV"

      # Open-source dependency scan (SCA) across all Maven modules.
      - name: Snyk Open Source
        run: >
          snyk test --maven-aggregate-project $SNYK_ORG_ARG
          --severity-threshold=$SNYK_SEVERITY_THRESHOLD
          --json-file-output=snyk-open-source.json

      # Static analysis (SAST). Requires Snyk Code to be enabled for the Snyk org.
      - name: Snyk Code
        if: success() || failure()
        run: >
          snyk code test $SNYK_ORG_ARG
          --severity-threshold=$SNYK_SEVERITY_THRESHOLD
          --json-file-output=snyk-code.json

      # On main, upload a dependency snapshot so Snyk keeps monitoring for newly disclosed vulnerabilities.
      - name: Snyk Monitor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: snyk monitor --maven-aggregate-project $SNYK_ORG_ARG

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-reports
          path: snyk-*.json
          if-no-files-found: ignore
